<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XM Mağaza</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#18202a}.wrap{max-width:1250px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}input,select,button,textarea{padding:11px;border:1px solid #ccd2d8;border-radius:8px;font-size:14px;width:100%}button{background:#17202a;color:#fff;cursor:pointer}.light{background:#e9edf1;color:#111}.danger{background:#b42318}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{min-width:110px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.hide{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.big{font-size:24px;font-weight:bold}.login{max-width:430px;margin:8vh auto}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}h1{font-size:23px}}
@media print{body>*{display:none!important}#labelsPrint{display:grid!important;grid-template-columns:repeat(3,1fr);gap:3mm;padding:5mm} .label{border:1px solid #000;text-align:center;padding:4mm;height:32mm;break-inside:avoid}.label b{font-size:12px}.label .bc{font-family:monospace;font-size:13px;margin-top:4px}}
</style></head><body>
<div id="login" class="wrap login"><div class="card"><h1>XM Mağaza</h1><p>Proqramı açmaq üçün daxil olun</p><input id="u" value="admin" placeholder="İstifadəçi"><br><br><input id="pw" value="admin123" type="password" placeholder="Şifrə"><br><br><button onclick="login()">Daxil ol</button><p id="er"></p></div></div>
<div id="main" class="wrap hide"><div class="card"><div class="row"><div><h1>XM Mağaza — Vahid Sistem</h1><small>Telefon + Kompüter</small></div><div><button class="light" onclick="logout()">Çıxış</button></div></div></div>
<div class="tabs"><button onclick="page('home')">Ana səhifə</button><button onclick="page('products')">Məhsullar</button><button onclick="page('sale')">Satış</button><button onclick="page('customers')">Müştərilər</button><button onclick="page('suppliers')">Təchizatçılar</button><button onclick="page('orders')">Onlayn sifarişlər</button><button onclick="page('labels')">A4 barkod</button><button onclick="page('stats')">Statistika</button><button onclick="page('alerts')">Xəbərdarlıq</button><button onclick="window.open('/shop','_blank')">Onlayn mağaza</button></div>
<section id="home"></section><section id="products" class="hide"></section><section id="sale" class="hide"></section><section id="customers" class="hide"></section><section id="suppliers" class="hide"></section><section id="orders" class="hide"></section><section id="labels" class="hide"></section><section id="stats" class="hide"></section><section id="alerts" class="hide"></section></div>
<div id="labelsPrint"></div>
<script>
let T=localStorage.getItem("xmT"),D={},cart=[];
const $=x=>document.getElementById(x),api=async(u,o={})=>{o.headers={...(o.headers||{}),...(T?{Authorization:"Bearer "+T}:{})};if(o.body&&typeof o.body!=="string"){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(o.body)}let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Xəta");return d};
async function login(){try{let d=await api("/api/login",{method:"POST",body:{username:$("u").value,password:$("pw").value}});T=d.token;localStorage.setItem("xmT",T);start()}catch(e){$("er").textContent=e.message}}
function logout(){localStorage.removeItem("xmT");location.reload()}
async function start(){try{D=await api("/api/data");$("login").classList.add("hide");$("main").classList.remove("hide");page("home")}catch(e){logout()}}
function page(x){document.querySelectorAll("#main section").forEach(s=>s.classList.add("hide"));$(x).classList.remove("hide");({home,products,sale,customers,suppliers,orders,labels,stats,alerts}[x])()}
async function home(){let s=await api("/api/stats"),a=await api("/api/alerts");$("home").innerHTML=`<div class=stats><div class=card>Satış<div class=big>${s.total.toFixed(2)} ₼</div></div><div class=card>Ödənilən<div class=big>${s.paid.toFixed(2)} ₼</div></div><div class=card>Borc<div class=big>${s.debt.toFixed(2)} ₼</div></div><div class=card>Xəbərdarlıq<div class=big>${a.length}</div></div></div><div class=card><h2>Qısa yol</h2><div class=row><button onclick="page('sale')">Yeni satış</button><button onclick="page('products')">Məhsul əlavə et</button><button onclick="page('labels')">Barkod çapı</button><button onclick="page('orders')">Sifarişlər</button></div></div>`}
async function products(){D=await api("/api/data");$("products").innerHTML=`<div class=card><h2>Məhsul əlavə et</h2><div class=row><input id=pn placeholder="Məhsul adı"><input id=pb placeholder="Barkod (boş qoysanız daxili barkod)"><input id=pc placeholder="Məhsul kodu"><input id=pg placeholder="Kateqoriya"><input id=pu value="ədəd" placeholder="Ölçü vahidi"><input id=ps type=number placeholder="Stok"><input id=pm type=number placeholder="Minimum stok"><input id=pe type=date><input id=cost type=number placeholder="Maya"><input id=pr type=number placeholder="Pərakəndə"><input id=pw type=number placeholder="Topdan"><input id=pv type=number placeholder="VIP"><input id=px type=number placeholder="Super topdan"></div><br><button onclick=addp()>Yadda saxla</button></div><div class=card><h2>Məhsullar</h2><table><tr><th>Məhsul</th><th>Barkod</th><th>Stok</th><th>Qiymətlər</th><th>Son tarix</th></tr>${D.products.map(p=>`<tr><td>${p.name}</td><td>${p.barcode}</td><td>${p.stock} ${p.unit}</td><td>${p.retail} / ${p.wholesale} / ${p.vip} / ${p.superWholesale}</td><td>${p.expiry||"-"}</td></tr>`).join("")}</table></div>`}
async function addp(){try{await api("/api/products",{method:"POST",body:{name:$("pn").value,barcode:$("pb").value,code:$("pc").value,category:$("pg").value,unit:$("pu").value,stock:$("ps").value,minStock:$("pm").value,expiry:$("pe").value,cost:$("cost").value,retail:$("pr").value,wholesale:$("pw").value,vip:$("pv").value,superWholesale:$("px").value}});products()}catch(e){alert(e.message)}}
async function sale(){D=await api("/api/data");$("sale").innerHTML=`<div class=card><h2>Satış</h2><div class=row><input id=sq placeholder="Barkod / məhsul adı / kod" oninput=find()><button onclick=scan()>📷 Kamera ilə barkod oxut</button><select id=sc><option value="">Ümumi satış — müştəri yoxdur</option>${D.customers.map(c=>`<option value=${c.id}>${c.name} | borc ${c.debt.toFixed(2)} ₼</option>`).join("")}</select></div><div id=found></div><hr><div id=cart></div><div class=row><input id=sp type=number placeholder="İndi ödənilən məbləğ"><select id=sm><option>nağd</option><option>kart</option><option>köçürmə</option></select></div><br><button onclick=finish()>Satışı tamamla</button></div>`}
function find(){let q=$("sq").value.toLowerCase();$("found").innerHTML=D.products.filter(p=>(p.name+" "+p.barcode+" "+p.code).toLowerCase().includes(q)).slice(0,10).map(p=>`<button class=light style="width:auto;margin:3px" onclick=add(${p.id})>${p.name} | ${p.barcode}</button>`).join("")}
async function scan(){if(!("BarcodeDetector"in window)){alert("Bu brauzer kamera barkod oxumağı dəstəkləmir. Barkodu əl ilə yaza bilərsiniz.");return}try{let det=new BarcodeDetector();let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}),v=document.createElement("video");v.autoplay=true;v.srcObject=stream;document.body.append(v);v.style="position:fixed;inset:10%;width:80%;z-index:10";let timer=setInterval(async()=>{try{let b=await det.detect(v);if(b[0]){$("sq").value=b[0].rawValue;find();clearInterval(timer);stream.getTracks().forEach(t=>t.stop());v.remove()}}catch(e){}},300)}catch(e){alert("Kameraya icazə verilmədi")}}
function add(id){let p=D.products.find(x=>x.id==id),q=Number(prompt("Miqdar:",1));if(!q)return;let l=prompt("Qiymət: retail / wholesale / vip / super","retail");let price=productPrice(p,l);price=Number(prompt("Satış qiyməti:",price));cart.push({productId:p.id,qty:q,price,level:l});renderCart()}
function productPrice(p,l){return Number(l==="wholesale"?p.wholesale:l==="vip"?p.vip:l==="super"?p.superWholesale:p.retail)}
function renderCart(){$("cart").innerHTML=cart.map((x,i)=>{let p=D.products.find(p=>p.id==x.productId);return `<div class=card>${p.name} — ${x.qty} × ${x.price} = ${(x.qty*x.price).toFixed(2)} ₼ <button class=danger onclick="cart.splice(${i},1);renderCart()">Sil</button></div>`}).join("")}
async function finish(){try{let s=await api("/api/sales",{method:"POST",body:{customerId:$("sc").value?Number($("sc").value):null,paid:Number($("sp").value||0),method:$("sm").value,items:cart}});alert("Satış #"+s.id+" tamamlandı");cart=[];sale()}catch(e){alert(e.message)}}
async function customers(){D=await api("/api/data");$("customers").innerHTML=`<div class=card><h2>Müştəri əlavə et</h2><div class=row><input id=cn placeholder="Ad soyad"><input id=ct placeholder="Telefon"><input id=ca placeholder="Ünvan"></div><br><button onclick=addc()>Yadda saxla</button></div><div class=card><table><tr><th>Ad</th><th>Telefon</th><th>Ünvan</th><th>Borc</th><th>Bonus</th><th>Ödəniş</th></tr>${D.customers.map(c=>`<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.address}</td><td>${c.debt.toFixed(2)} ₼</td><td>${c.bonus.toFixed(2)}</td><td><button onclick=cpay(${c.id})>Borc ödə</button></td></tr>`).join("")}</table></div>`}
async function addc(){await api("/api/customers",{method:"POST",body:{name:$("cn").value,phone:$("ct").value,address:$("ca").value}});customers()}
async function cpay(id){let a=prompt("Ödəniş məbləği:");if(a)await api("/api/customers/"+id+"/pay",{method:"POST",body:{amount:Number(a)}});customers()}
async function suppliers(){D=await api("/api/data");$("suppliers").innerHTML=`<div class=card><h2>Təchizatçı əlavə et</h2><div class=row><input id=sn placeholder="Şirkət / şəxs adı"><input id=st placeholder="Telefon"><input id=sa placeholder="Ünvan"></div><br><button onclick=adds()>Yadda saxla</button></div><div class=card><table><tr><th>Təchizatçı</th><th>Telefon</th><th>Borc</th><th>Alış</th><th>Ödəniş</th></tr>${D.suppliers.map(s=>`<tr><td>${s.name}</td><td>${s.phone}</td><td>${s.debt.toFixed(2)} ₼</td><td><button onclick=spurchase(${s.id})>Mal alışı</button></td><td><button onclick=spay(${s.id})>Ödəniş</button></td></tr>`).join("")}</table></div>`}
async function adds(){await api("/api/suppliers",{method:"POST",body:{name:$("sn").value,phone:$("st").value,address:$("sa").value}});suppliers()}
async function spurchase(id){let a=prompt("Alış məbləği:");if(a)await api("/api/suppliers/"+id+"/purchase",{method:"POST",body:{amount:Number(a),description:prompt("Qeyd:","Mal alış")}});suppliers()}
async function spay(id){let a=prompt("Təchizatçıya ödəniş:");if(a)await api("/api/suppliers/"+id+"/pay",{method:"POST",body:{amount:Number(a)}});suppliers()}
async function orders(){let o=await api("/api/orders");$("orders").innerHTML=`<div class=card><h2>Onlayn sifarişlər</h2><table><tr><th>№</th><th>Müştəri</th><th>Məbləğ</th><th>Status</th><th>Tarix</th></tr>${o.map(x=>`<tr><td>#${x.id}</td><td>${x.customer.name||""} ${x.customer.phone||""}</td><td>${x.total.toFixed(2)} ₼</td><td><select onchange="status(${x.id},this.value)"><option ${x.status==="Yeni sifariş"?"selected":""}>Yeni sifariş</option><option ${x.status==="Hazırlanır"?"selected":""}>Hazırlanır</option><option ${x.status==="Hazırdır"?"selected":""}>Hazırdır</option><option ${x.status==="Təhvil verildi"?"selected":""}>Təhvil verildi</option><option ${x.status==="Ləğv edildi"?"selected":""}>Ləğv edildi</option></select></td><td>${new Date(x.date).toLocaleString()}</td></tr>`).join("")}</table></div>`}
async function status(id,v){await api("/api/orders/"+id,{method:"PUT",body:{status:v}});orders()}
async function labels(){D=await api("/api/data");$("labels").innerHTML=`<div class=card><h2>A4 barkod etiketləri</h2><p>Məhsulu seçin və neçə etiket lazım olduğunu yazın.</p><table><tr><th>Məhsul</th><th>Barkod</th><th>Qiymət</th><th>Say</th></tr>${D.products.map(p=>`<tr><td>${p.name}</td><td>${p.barcode}</td><td>${p.retail} ₼</td><td><input id="l${p.id}" type=number value=1 min=1></td></tr>`).join("")}</table><br><button onclick=printLabels()>A4 çap et</button></div>`}
async function printLabels(){let arr=[];D.products.forEach(p=>{let n=Number($("l"+p.id).value||0);for(let i=0;i<n;i++)arr.push(`<div class=label><b>${p.name}</b><div>${p.retail} ₼</div><div class=bc>*${p.barcode}*</div><small>${p.barcode}</small></div>`)});$("labelsPrint").innerHTML=arr.join("");window.print()}
async function stats(){let s=await api("/api/stats");$("stats").innerHTML=`<div class=card><h2>Statistika</h2><div class=stats><div>Satış<br><b>${s.total.toFixed(2)} ₼</b></div><div>Ödənilən<br><b>${s.paid.toFixed(2)} ₼</b></div><div>Borc<br><b>${s.debt.toFixed(2)} ₼</b></div><div>Satış sayı<br><b>${s.count}</b></div></div></div><div class=card><table><tr><th>Məhsul</th><th>Satılan</th><th>Satış</th><th>Mənfəət</th></tr>${s.products.map(p=>`<tr><td>${p.name}</td><td>${p.qty}</td><td>${p.revenue.toFixed(2)} ₼</td><td>${p.profit.toFixed(2)} ₼</td></tr>`).join("")}</table></div>`}
async function alerts(){let a=await api("/api/alerts");$("alerts").innerHTML=`<div class=card><h2>Az stok / Son istifadə</h2><table><tr><th>Məhsul</th><th>Stok</th><th>Son tarix</th><th>Səbəb</th></tr>${a.map(p=>`<tr><td>${p.name}</td><td>${p.stock} ${p.unit}</td><td>${p.expiry||"-"}</td><td>${p.stock<=p.minStock?"Az stok":"Son istifadə tarixi yaxınlaşır"}</td></tr>`).join("")}</table></div>`}
if(T)start();
</script></body></html>
