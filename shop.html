<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XM Onlayn Mağaza</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0}.wrap{max-width:1100px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.p{background:white;padding:14px;border-radius:12px}.p img{width:100%;height:160px;object-fit:contain}.p button{width:100%;padding:10px;background:#111;color:#fff;border:0;border-radius:8px}.cart{position:sticky;bottom:0;background:#111;color:#fff;padding:12px}</style></head><body><div class=wrap><h1>XM Mağaza — Onlayn sifariş</h1><div id=p class=grid></div><div class=cart><b>Səbət: <span id=n>0</span></b> <button onclick=order()>Sifarişi göndər</button></div></div>
<script>let ps=[],cart=[];async function load(){ps=await (await fetch("/api/shop/products")).json();document.getElementById("p").innerHTML=ps.map(x=>`<div class=p>${x.image?`<img src="${x.image}">`:""}<h3>${x.name}</h3><p>${x.price} ₼ / ${x.unit}</p><button onclick="add(${x.id})">Səbətə əlavə et</button></div>`).join("")}function add(id){let p=ps.find(x=>x.id==id),q=Number(prompt("Miqdar:",1));if(q)cart.push({id:p.id,name:p.name,qty:q,price:p.price}),document.getElementById("n").textContent=cart.length}async function order(){if(!cart.length)return alert("Səbət boşdur");let name=prompt("Ad soyad:"),phone=prompt("Telefon:"),address=prompt("Ünvan:");if(!name||!phone)return;let total=cart.reduce((a,x)=>a+x.qty*x.price,0);await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer:{name,phone,address},items:cart,total})});alert("Sifariş qəbul edildi");cart=[];document.getElementById("n").textContent=0}load()</script></body></html>
